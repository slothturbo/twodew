<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>two::dew</title>

    <!-- Makes the icon + splash feel native when added to your phone's home screen -->
    <meta name="theme-color" content="#FF5A1F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="two::dew" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded here rather than via @import inside the JS-injected stylesheet: as an
         @import the browser couldn't even discover the fonts until the whole JS bundle
         had downloaded, parsed and mounted React. Here they download in parallel with
         the bundle instead, which is the difference between one round-trip and three
         on a slow phone. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="icon" href="/icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <style>
      html, body, #root { height: 100%; margin: 0; background: #050505; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
